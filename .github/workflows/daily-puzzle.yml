name: Generate Chronanza daily puzzle
on:
  schedule:
    # 04:05 UTC covers 00:05 Eastern during daylight saving; 05:05 UTC covers standard time.
    - cron: '5 4,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chronanza-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate or refresh daily puzzle
        run: python scripts/generate_daily.py
      - name: Commit generated data if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add puzzles.json daily.json daily-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate daily Chronanza puzzle"
            git push
          fi
